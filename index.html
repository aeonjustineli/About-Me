    <script>
        const music = document.getElementById('bg-music');
        const volumeSlider = document.getElementById('volume-slider');
        const trackSelector = document.getElementById('track-selector');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const loopBtn = document.getElementById('loop-btn');

        let isShuffle = false;
        let isLoopOne = true;

        music.volume = volumeSlider.value;
        volumeSlider.addEventListener('input', function() {
            music.volume = this.value;
        });

        trackSelector.addEventListener('change', function() {
            changeTrack(this.value);
        });

        function changeTrack(src) {
            const wasPlaying = !music.paused;
            music.src = src;
            music.load();
            if (wasPlaying) {
                music.play();
            }
        }

        shuffleBtn.addEventListener('click', function() {
            isShuffle = !isShuffle;
            shuffleBtn.style.opacity = isShuffle ? "1" : "0.6";
            if (isShuffle && isLoopOne) {
                isLoopOne = false;
                loopBtn.style.opacity = "0.6";
                loopBtn.innerText = "⇄";
            }
        });

        loopBtn.addEventListener('click', function() {
            if (isLoopOne) {
                isLoopOne = false;
                loopBtn.style.opacity = "0.6";
                loopBtn.innerText = "⇄";
            } else {
                isLoopOne = true;
                loopBtn.style.opacity = "1";
                loopBtn.innerText = "⇄";
                if (isShuffle) {
                    isShuffle = false;
                    shuffleBtn.style.opacity = "0.6";
                }
            }
        });

        music.addEventListener('ended', function() {
            if (isLoopOne) {
                music.play();
            } else if (isShuffle) {
                const options = trackSelector.options;
                const randomIndex = Math.floor(Math.random() * options.length);
                trackSelector.selectedIndex = randomIndex;
                changeTrack(options[randomIndex].value);
                music.play();
            } else {
                let nextIndex = trackSelector.selectedIndex + 1;
                if (nextIndex >= trackSelector.options.length) {
                    nextIndex = 0;
                }
                trackSelector.selectedIndex = nextIndex;
                changeTrack(trackSelector.options[nextIndex].value);
                music.play();
            }
        });
    </script>
